
# ==============================================================================
# Nexora — Render Blueprint (Infrastructure-as-Code)
#
# Deploy with: Render Dashboard -> "New Blueprint Instance" -> select this repo
# Or one-click: https://render.com/deploy?repo=https://github.com/miral14022006/nexora
#
# FREE-TIER DEMO MODE:
#   - Every service is `type: web` + `plan: free` — $0/month (free web services
#     are the only free plan allowed for compute on Render).
#   - CAVEATS:
#       * Free web services spin down after 15 minutes of idle traffic. Active
#         browser tabs keep the WebSocket chain awake (heartbeats count as
#         traffic); Kafka consumers and background work pause while asleep and
#         resume on the next request.
#       * Every service gets a PUBLIC URL (free services can't be private).
#         Downstream services are still protected: api-gateway-issued JWTs
#         guard user-scoped routes, and SERVICE_SECRET guards internal trust
#         headers on chat/media. See SECURITY note in DEPLOY_RENDER.md.
#   - For production behavior (private services, no spin-down), swap any
#     `plan: free` + `type: web` back to `type: pserv` + `plan: starter`.
#
# Other notes:
#   - All services deploy concurrently; every service retries its DB/Redis
#     connections at startup (withRetry) so boot order doesn't matter.
#   - Kafka and S3 are NOT provided by Render — provision them externally
#     (Upstash Kafka + any S3-compatible store) and fill the sync:false env
#     vars prompted in the Dashboard after the first deploy.
#   - Free Postgres expires after 30 days; swap to basic-256mb for production.
#
# Schema: https://render.com/docs/blueprint-spec
# ==============================================================================

envVarGroups:
  # ─── Shared secrets (every service gets at least NODE_ENV) ────────────────
  - name: nexora-shared-secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a base64 256-bit value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SERVICE_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "10"

  # ─── Upstash Kafka credentials (fill in Dashboard after first deploy) ─────
  - name: nexora-kafka
    envVars:
      - key: KAFKA_BROKERS
        sync: false # e.g. "kafka-1.upstash.io:9092,kafka-2.upstash.io:9092"
      - key: KAFKA_SASL_MECHANISM
        value: scram-sha-256
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_SSL
        value: "true"

  # ─── S3-compatible storage for media-service (fill in after first deploy) ─
  # media-service degrades gracefully: it boots and serves 503 on media routes
  # until these are configured, so the rest of the app works without S3.
  - name: nexora-minio
    envVars:
      - key: MINIO_INTERNAL_ENDPOINT
        sync: false # internal endpoint host (e.g. "s3.amazonaws.com")
      - key: MINIO_PUBLIC_ENDPOINT
        sync: false # public endpoint for presigned URLs
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_USE_SSL
        value: "true"
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: nexora-media

# ─── Managed Postgres ────────────────────────────────────────────────────────
# ipAllowList: [] keeps it internal-network-only (services connect via
# fromDatabase connectionString over Render's private network).
databases:
  - name: nexora-postgres
    databaseName: nexora
    user: nexora
    plan: free # Swap to basic-256mb for persistent production data
    region: oregon
    ipAllowList: []

# ─── Services (all free web — see FREE-TIER DEMO MODE above) ─────────────────
services:
  # ── Redis (Render Key Value, internal-only) ───────────────────────────────
  - type: keyvalue
    name: nexora-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal connections only

  # ── Frontend (public) ─────────────────────────────────────────────────────
  # Vite SPA served by nginx. With VITE_API_BASE_URL unset (default) the SPA
  # calls relative /api + /ws, which nginx proxies to the api-gateway over the
  # internal network. To call the gateway directly instead, add
  # VITE_API_BASE_URL (the gateway's public URL) in the Dashboard and redeploy.
  - type: web
    name: nexora-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "80"
      - key: API_GATEWAY_UPSTREAM
        fromService:
          name: nexora-api-gateway
          type: web
          property: hostport

  # ── api-gateway (public entry point) ──────────────────────────────────────
  - type: web
    name: nexora-api-gateway
    runtime: docker
    dockerContext: .
    dockerfilePath: services/api-gateway/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - key: SERVICE_NAME
        value: api-gateway
      - key: PORT
        value: "3000"
      # Downstream service URLs (fromService hostport = bare "host:port";
      # api-gateway's config.js adds the http:// scheme).
      - key: AUTH_SERVICE_URL
        fromService:
          name: nexora-auth
          type: web
          property: hostport
      - key: USER_SERVICE_URL
        fromService:
          name: nexora-user
          type: web
          property: hostport
      - key: GROUP_SERVICE_URL
        fromService:
          name: nexora-group
          type: web
          property: hostport
      - key: CHAT_SERVICE_URL
        fromService:
          name: nexora-chat
          type: web
          property: hostport
      - key: MEDIA_SERVICE_URL
        fromService:
          name: nexora-media
          type: web
          property: hostport
      - key: GATEWAY_HTTP_URL
        fromService:
          name: nexora-websocket-gateway
          type: web
          property: hostport
      - key: WS_GATEWAY_URLS
        fromService:
          name: nexora-websocket-gateway
          type: web
          property: hostport

  # ── websocket-gateway (WS termination; browser reaches it via api-gateway) ─
  - type: web
    name: nexora-websocket-gateway
    runtime: docker
    dockerContext: .
    dockerfilePath: services/websocket-gateway/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - key: SERVICE_NAME
        value: websocket-gateway
      - key: PORT
        value: "3008"
      - key: DELIVERY_RECEIPT_CHANNEL
        value: "delivery:receipts"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexora-redis
          type: keyvalue
          property: connectionString

  # ── auth-service ──────────────────────────────────────────────────────────
  - type: web
    name: nexora-auth
    runtime: docker
    dockerContext: .
    dockerfilePath: services/auth-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - key: SERVICE_NAME
        value: auth-service
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString

  # ── user-service ──────────────────────────────────────────────────────────
  - type: web
    name: nexora-user
    runtime: docker
    dockerContext: .
    dockerfilePath: services/user-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - key: SERVICE_NAME
        value: user-service
      - key: PORT
        value: "3002"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString

  # ── group-service ─────────────────────────────────────────────────────────
  - type: web
    name: nexora-group
    runtime: docker
    dockerContext: .
    dockerfilePath: services/group-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - key: SERVICE_NAME
        value: group-service
      - key: PORT
        value: "3003"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString

  # ── chat-service ──────────────────────────────────────────────────────────
  - type: web
    name: nexora-chat
    runtime: docker
    dockerContext: .
    dockerfilePath: services/chat-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - fromGroup: nexora-kafka
      - key: SERVICE_NAME
        value: chat-service
      - key: PORT
        value: "3004"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexora-redis
          type: keyvalue
          property: connectionString

  # ── delivery-service (Kafka consumer) ─────────────────────────────────────
  - type: web
    name: nexora-delivery
    runtime: docker
    dockerContext: .
    dockerfilePath: services/delivery-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - fromGroup: nexora-kafka
      - key: SERVICE_NAME
        value: delivery-service
      - key: PORT
        value: "3005"
      - key: DELIVERY_RECEIPT_CHANNEL
        value: "delivery:receipts"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexora-redis
          type: keyvalue
          property: connectionString

  # ── presence-service ──────────────────────────────────────────────────────
  - type: web
    name: nexora-presence
    runtime: docker
    dockerContext: .
    dockerfilePath: services/presence-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - key: SERVICE_NAME
        value: presence-service
      - key: PORT
        value: "3006"

  # ── notification-service (Kafka consumer) ─────────────────────────────────
  - type: web
    name: nexora-notification
    runtime: docker
    dockerContext: .
    dockerfilePath: services/notification-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - fromGroup: nexora-kafka
      - key: SERVICE_NAME
        value: notification-service
      - key: PORT
        value: "3007"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexora-redis
          type: keyvalue
          property: connectionString

  # ── media-service ─────────────────────────────────────────────────────────
  - type: web
    name: nexora-media
    runtime: docker
    dockerContext: .
    dockerfilePath: services/media-service/Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - fromGroup: nexora-shared-secrets
      - fromGroup: nexora-minio
      - key: SERVICE_NAME
        value: media-service
      - key: PORT
        value: "3010"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
